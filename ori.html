/* ---------- FX ---------- */
@keyframes flicker {
  0%, 100% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  91% {
    opacity: 0.35;
  }
  92% {
    opacity: 1;
  }
  95% {
    opacity: 0.55;
  }
  96% {
    opacity: 1;
  }
}
.fx-flicker {
  animation: flicker 2.8s linear infinite;
}
@keyframes blinkHard {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0.1;
  }
}
.fx-blink {
  animation: blinkHard 1s steps(1) infinite;
}
@keyframes shakeX {
  0%, 100% {
    transform: translate(0, 0);
  }
  15% {
    transform: translate(-7px, 3px) rotate(-0.4deg);
  }
  35% {
    transform: translate(6px, -4px) rotate(0.4deg);
  }
  55% {
    transform: translate(-5px, -2px);
  }
  75% {
    transform: translate(5px, 3px);
  }
}
.fx-shake {
  animation: shakeX 0.45s ease-in-out;
}
@keyframes flashOut {
  0% {
    opacity: 0.95;
  }
  100% {
    opacity: 0;
  }
}
.fx-flash {
  animation: flashOut 0.55s ease-out forwards;
}
@keyframes burstFly {
  0% {
    transform: translate(0, 0) rotate(0deg) scale(0.5);
    opacity: 1;
  }
  70% {
    opacity: 1;
  }
  100% {
    transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.2);
    opacity: 0;
  }
}
.particle {
  position: absolute;
  pointer-events: none;
  animation: burstFly 0.95s cubic-bezier(0.17, 0.67, 0.35, 1) forwards;
  will-change: transform, opacity;
}
@keyframes roadMove {
  to {
    transform: translateY(60px);
  }
}
.road-line {
  position: absolute;
  left: 50%;
  top: -60px;
  bottom: -60px;
  width: 8px;
  margin-left: -4px;
  background: repeating-linear-gradient(to bottom, var(--gold) 0 30px, transparent 30px 60px);
  animation: roadMove 0.55s linear infinite;
}
@keyframes floatY {
  0%, 100% {
    transform: translateY(0) rotate(-5deg);
  }
  50% {
    transform: translateY(-13px) rotate(6deg);
  }
}
.fx-floaty {
  animation: floatY 3.2s ease-in-out infinite;
}
@keyframes marqueeX {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}
.fx-marquee {
  animation: marqueeX 20s linear infinite;
}
@keyframes popIn {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
.fx-pop {
  animation: popIn 0.4s ease both;
}
@keyframes glowPulse {
  0%, 100% {
    box-shadow: 0 0 14px rgba(255, 42, 122, 0.45), inset 0 0 12px rgba(255, 42, 122, 0.12);
  }
  50% {
    box-shadow: 0 0 30px rgba(255, 42, 122, 0.8), inset 0 0 18px rgba(255, 42, 122, 0.25);
  }
}
.fx-glow {
  animation: glowPulse 1.6s ease-in-out infinite;
}
@keyframes signalBlink {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.25;
  }
}
.fx-signal {
  animation: signalBlink 1.1s ease-in-out infinite;
}
@keyframes showZoom {
  from {
    transform: scale(0.9);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
.fx-showzoom {
  animation: showZoom 0.45s ease both;
}
@keyframes loadBar {
  from {
    width: 4%;
  }
  to {
    width: 100%;
  }
}
.fx-loadbar {
  animation: loadBar 1.4s linear forwards;
}
@keyframes hpPulse {
  0%, 100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.6);
  }
}
.fx-hp {
  animation: hpPulse 0.7s ease-in-out infinite;
}
