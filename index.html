:root {
  --surface: #030507;
  --panel: #0a0f14;
  --panel2: #0d141c;
  --ink: #f5f0e6;
  --muted: #93a3b5;
  --orange: #ff7a18;
  --ice: #22e6ff;
  --fire: #ff3a3a;
  --gold: #ffd24a;
  --safe-area-inset-top: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #030507;
    --panel: #0a0f14;
    --panel2: #0d141c;
    --ink: #f5f0e6;
    --muted: #93a3b5;
    --orange: #ff7a18;
    --ice: #22e6ff;
    --fire: #ff3a3a;
    --gold: #ffd24a;
  }
}
html {
  background: var(--surface);
}
body {
  background: var(--surface);
  color: var(--ink);
  font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
}
.font-display {
  font-family: Impact, "Arial Black", "Franklin Gothic Heavy", sans-serif;
  letter-spacing: 0.04em;
}
/* ---------- falling snow + pumpkins ---------- */
@keyframes fall {
  0% {
    transform: translate3d(0, -6vh, 0) rotate(0deg);
    opacity: 0;
  }
  8% {
    opacity: 1;
  }
  92% {
    opacity: 1;
  }
  100% {
    transform: translate3d(3vw, 108vh, 0) rotate(340deg);
    opacity: 0;
  }
}
.flake {
  position: fixed;
  top: 0;
  pointer-events: none;
  z-index: 5;
  animation-name: fall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  will-change: transform;
}
/* ---------- flying dragon ---------- */
@keyframes dragonfly {
  0%   {
    transform: translate(-18vw, 10vh) rotate(-4deg);
  }
  20%  {
    transform: translate(8vw, 4vh) rotate(3deg);
  }
  45%  {
    transform: translate(38vw, 15vh) rotate(-3deg);
  }
  70%  {
    transform: translate(68vw, 5vh) rotate(4deg);
  }
  100% {
    transform: translate(112vw, 12vh) rotate(-2deg);
  }
}
.dragon-fly {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 40;
  animation: dragonfly 16s linear infinite;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  filter: drop-shadow(0 0 14px rgba(34, 230, 255, 0.55)) drop-shadow(0 0 22px rgba(255, 58, 58, 0.35));
}
.dragon-trail {
  position: absolute;
  right: 88%;
  top: 55%;
  white-space: nowrap;
  font-size: clamp(14px, 2.4vw, 26px);
  letter-spacing: 0.35em;
  opacity: 0.85;
  pointer-events: none;
  animation: trailflicker 0.35s steps(2) infinite;
}
@keyframes trailflicker {
  0% {
    opacity: 0.35;
    transform: translateX(0) scaleY(1);
  }
  100% {
    opacity: 0.95;
    transform: translateX(-4px) scaleY(1.15);
  }
}
/* ---------- breathing background dragons ---------- */
@keyframes breath {
  0%, 100% {
    transform: scale(1);
    opacity: 0.10;
  }
  50% {
    transform: scale(1.12);
    opacity: 0.2;
  }
}
.breath-dragon {
  position: absolute;
  pointer-events: none;
  animation: breath 5s ease-in-out infinite;
  filter: blur(0.4px);
}
@keyframes breathglow {
  0%, 100% {
    opacity: 0.25;
    transform: scale(0.8);
  }
  50% {
    opacity: 0.8;
    transform: scale(1.25);
  }
}
.breath-glow {
  position: absolute;
  border-radius: 9999px;
  pointer-events: none;
  animation: breathglow 5s ease-in-out infinite;
}
/* ---------- blink / flicker / pulse ---------- */
@keyframes blinkhard {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0.08;
  }
}
.blink-hard {
  animation: blinkhard 1s steps(1) infinite;
}
@keyframes msflicker {
  0% {
    opacity: 1;
  }
  30% {
    opacity: 0.35;
  }
  55% {
    opacity: 0.9;
  }
  80% {
    opacity: 0.45;
  }
  100% {
    opacity: 1;
  }
}
.ms-flicker {
  animation: msflicker 0.18s linear infinite;
}
@keyframes eyepulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(255, 210, 74, 0.55);
  }
  50% {
    box-shadow: 0 0 0 7px rgba(255, 210, 74, 0);
  }
}
.eye-dot {
  animation: eyepulse 1.6s ease-out infinite;
}
@keyframes hpflow {
  0% {
    background-position: 0% 50%;
  }
  100% {
    background-position: 200% 50%;
  }
}
.hp-flow {
  background-size: 200% 100%;
  animation: hpflow 1.6s linear infinite;
}
/* ---------- icefire blast ---------- */
@keyframes blastanim {
  0% {
    transform: scale(0.2) rotate(-8deg);
    opacity: 0;
  }
  25% {
    opacity: 1;
  }
  100% {
    transform: scale(1.6) rotate(6deg);
    opacity: 0;
  }
}
.blast-core {
  animation: blastanim 0.9s ease-out forwards;
}
@keyframes shakeanim {
  0%, 100% {
    transform: translate(0, 0);
  }
  20% {
    transform: translate(-7px, 3px) rotate(-0.4deg);
  }
  40% {
    transform: translate(6px, -4px) rotate(0.4deg);
  }
  60% {
    transform: translate(-5px, -3px);
  }
  80% {
    transform: translate(5px, 4px);
  }
}
.shake {
  animation: shakeanim 0.5s ease-in-out;
}
@keyframes hatpop {
  0% {
    transform: translateY(-16px) scale(0.4) rotate(-24deg);
    opacity: 0;
  }
  60% {
    transform: translateY(2px) scale(1.25) rotate(8deg);
    opacity: 1;
  }
  100% {
    transform: translateY(0) scale(1) rotate(-8deg);
    opacity: 1;
  }
}
.hat-pop {
  animation: hatpop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
}
@keyframes marquee {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}
.marquee-track {
  display: inline-flex;
  white-space: nowrap;
  animation: marquee 26s linear infinite;
  will-change: transform;
}
@keyframes toastin {
  0% {
    transform: translateY(18px) scale(0.92);
    opacity: 0;
  }
  100% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}
.toast-in {
  animation: toastin 0.25s ease-out;
}
@keyframes floaty {
  0%, 100% {
    transform: translateY(0) rotate(-4deg);
  }
  50% {
    transform: translateY(-9px) rotate(5deg);
  }
}
.floaty {
  animation: floaty 3.2s ease-in-out infinite;
}
.last\:border-0:last-child {
  border-width: 0px;
}
.hover\:-translate-y-0\.5:hover {
  --tw-translate-y: -0.125rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}
.hover\:-translate-y-1:hover {
  --tw-translate-y: -0.25rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

  border-color: var(--gold);
}
@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:p-5 {
    padding: 1.25rem;
  }
  .sm\:p-6 {
    padding: 1.5rem;
  }
  .sm\:px-2\.5 {
    padding-left: 0.625rem;
    padding-right: 0.625rem;
  }
  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:pt-12 {
    padding-top: 3rem;
  }
  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }
  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 768px) {
  .md\:flex {
    display: flex;
  }
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
