:root{
  --bg:#030507;
  --surface:#0a1018;
  --line:#1b2a3a;
  --gold:#ffd24a;
  --cy:#22e6ff;
  --grn:#3dffa0;
  --red:#ff5a4d;
  --org:#ff7a18;
  --ink:#e8f1f8;
  --mut:#7d93a8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#030507;
    --surface:#0a1018;
    --line:#1b2a3a;
    --ink:#e8f1f8;
    --mut:#7d93a8;
  }
}
html{
  background:var(--bg);
}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Space Grotesk',system-ui,sans-serif;
}
.mono{
  font-family:'JetBrains Mono',ui-monospace,monospace;
}
@keyframes glitchShift{
  0%{
    transform:translate(0)
  }
  20%{
    transform:translate(-3px,2px)
  }
  40%{
    transform:translate(3px,-2px)
  }
  60%{
    transform:translate(-2px,-1px)
  }
  80%{
    transform:translate(2px,1px)
  }
  100%{
    transform:translate(0)
  }
}
@keyframes flicker{
  0%,100%{
    opacity:1
  }
  92%{
    opacity:1
  }
  93%{
    opacity:.4
  }
  94%{
    opacity:1
  }
  96%{
    opacity:.6
  }
  97%{
    opacity:1
  }
}
@keyframes snowfall{
  0%{
    transform:translateY(-10px)
  }
  100%{
    transform:translateY(110vh)
  }
}
@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }
  50%{
    transform:translateY(-8px)
  }
}
@keyframes pulseDot{
  0%,100%{
    box-shadow:0 0 0 0 rgba(61,255,160,.5)
  }
  50%{
    box-shadow:0 0 0 7px rgba(61,255,160,0)
  }
}
@keyframes scanline{
  0%{
    top:-10%
  }
  100%{
    top:110%
  }
}
@keyframes emberRise{
  0%{
    transform:translateY(0) scale(1);
    opacity:1
  }
  100%{
    transform:translateY(-90px) scale(.3);
    opacity:0
  }
}
.glitching{
  animation:glitchShift .28s steps(2) infinite, flicker 3s linear infinite;
}
.rgb-split{
  text-shadow:3px 0 var(--red), -3px 0 var(--cy);
}
.snowflake{
  position:absolute;
  top:-20px;
  color:#bfe9ff;
  animation:snowfall linear infinite;
  pointer-events:none;
}
.ember{
  position:absolute;
  bottom:6px;
  border-radius:9999px;
  animation:emberRise ease-out infinite;
  pointer-events:none;
}
.scanbeam{
  position:absolute;
  left:0;
  right:0;
  height:70px;
  background:linear-gradient(180deg,transparent,rgba(34,230,255,.10),transparent);
  animation:scanline 7s linear infinite;
  pointer-events:none;
}
.hover\:brightness-110:hover{
  --tw-brightness: brightness(1.1);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

  }
  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
  .sm\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }
  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }
  .sm\:text-4xl{
    font-size: 2.25rem;

  }
  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }
  .sm\:text-7xl{
    font-size: 4.5rem;
    line-height: 1;
  }
  .sm\:text-base{
    font-size: 1rem;
    line-height: 1.5rem;
  }
  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}
@media (min-width: 1024px){
  .lg\:order-2{

  }
