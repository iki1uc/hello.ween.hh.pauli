html,
body,
#root {
  min-height: 100%;

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/*
 * Tailwind v4's Preflight no longer sets `cursor: pointer` on buttons, so
 * clickable controls fall back to the default arrow cursor. Restore the
 * pointer cursor on interactive elements so artifacts give a clear
 * "this is clickable" affordance on hover.
 */

button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label[for],
select:not(:disabled),
summary {
  cursor: pointer;
}

.selection\:bg-\[var\(--gold\)\] *::-moz-selection {
  background-color: var(--gold);
}

.selection\:bg-\[var\(--gold\)\] *::selection {
  background-color: var(--gold);
}

.selection\:text-black *::-moz-selection {
  --tw-text-opacity: 1;

}

  --tw-text-opacity: 1;

}

  background-color: var(--gold);
}

.selection\:bg-\[var\(--gold\)\]::selection {
  background-color: var(--gold);
}

.selection\:text-black::-moz-selection {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.selection\:text-black::selection {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

}

}

}
