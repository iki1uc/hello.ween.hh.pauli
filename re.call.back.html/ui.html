:root {
  --bg: #0a0c08;
  --surface: #11140d;
  --raise: #171d10;
  --gold: #e0a81c;
  --cyan: #2fd6c8;
  --green: #39ff88;
  --red: #ff5a5f;
  --ink: #dde7cb;
  --muted: #85936f;
  --line: #26301b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0c08;
    --surface: #11140d;
    --raise: #171d10;
    --gold: #e0a81c;
    --cyan: #2fd6c8;
    --green: #39ff88;
    --red: #ff5a5f;
    --ink: #dde7cb;
    --muted: #85936f;
    --line: #26301b;
  }
}
html {
  background: var(--bg);
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.font-disp {
  font-family: 'Space Grotesk', 'JetBrains Mono', ui-sans-serif, sans-serif;
}
::-moz-selection {
  background: var(--gold);
  color: #0a0c08;
}
::selection {
  background: var(--gold);
  color: #0a0c08;
}
@keyframes blinkdot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.12;
  }
}
.blink {
  animation: blinkdot 1.1s steps(2) infinite;
}
@keyframes burst {
  0% {
    transform: scale(0.55);
    opacity: 0.95;
  }
  100% {
    transform: scale(2.6);
    opacity: 0;
  }
}
.burst {
  transform-box: fill-box;
  transform-origin: center;
  animation: burst 0.9s ease-out forwards;
}
@keyframes idlering {
  0% {
    transform: scale(1);
    opacity: 0.26;
  }
  100% {
    transform: scale(1.22);
    opacity: 0.04;
  }
}
.idle-ring {
  transform-box: fill-box;
  transform-origin: center;
  animation: idlering 2.2s ease-in-out infinite alternate;
}
@keyframes dashmove {
  to {
    stroke-dashoffset: -24;
  }
}
.dash-anim {
  stroke-dasharray: 5 7;
  animation: dashmove 1.2s linear infinite;
}
@keyframes flick {
  0%, 100% {
    opacity: 1;
  }
  92% {
    opacity: 1;
  }
  93% {
    opacity: 0.35;
  }
  94% {
    opacity: 1;
  }
  97% {
    opacity: 0.55;
  }
  98% {
    opacity: 1;
  }
}
.flick {
  animation: flick 7s linear infinite;
}
.scroll-slim::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.scroll-slim::-webkit-scrollbar-thumb {
  background: #2c381d;
  border-radius: 3px;
}
.scroll-slim::-webkit-scrollbar-track {
  background: transparent;
}
.bg-grid {
  background-image:
    linear-gradient(rgba(224, 168, 28, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(224, 168, 28, 0.045) 1px, transparent 1px);
  background-size: 26px 26px;
}

}

}

}
.hover\:border-\[var\(--cyan\)\]:hover{

}
.hover\:border-\[var\(--gold\)\]:hover{

}
.hover\:bg-\[var\(--cyan\)\]:hover{
  background-color: var(--cyan);
}
.hover\:bg-\[var\(--gold\)\]:hover{

}
.hover\:bg-\[var\(--green\)\]:hover{
  background-color: var(--green);
}
.hover\:bg-\[var\(--raise\)\]:hover{
  background-color: var(--raise);
}
.hover\:bg-\[var\(--red\)\]:hover{
  background-color: var(--red);
}
.hover\:text-\[var\(--cyan\)\]:hover{
  color: var(--cyan);
}
.hover\:text-\[var\(--gold\)\]:hover{
  color: var(--gold);
}
.hover\:text-black:hover{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));

.disabled\:cursor-wait:disabled{

}
.disabled\:opacity-40:disabled{

}
.group:hover .group-hover\:text-\[var\(--gold\)\]{
  color: var(--gold);

@media (min-width: 640px){
