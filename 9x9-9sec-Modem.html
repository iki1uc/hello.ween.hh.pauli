  let h = takt * 756;
  const src = \`\${atom}:\${iki}:\${ind}\`;
  for(let i=0;i<src.length;i++) h = (h*3 + src.charCodeAt(i)*9) % 81;
  return h;
}

export function complexify_01(seed3x3, seed9x9, takt, seg) {
  // seed3x3 = [3,3] kombinationen, seed9x9 = [9,9]
  const grid = Array(DIM).fill(0).map(()=>Array(DIM).fill(0));
  const base = hashAtom(seed3x3.atom, seed3x3.iki, seed3x3.ind, takt);

  for(let y=0;y<DIM;y++){
    for(let x=0;x<DIM;x++){
      const c3 = (x % 3 + y % 3 + base) % 2;
      const c9 = (Math.floor(x/3) + Math.floor(y/3)*3 + takt) % 2;
      const mirror = (x === (8 - x) || y === takt) ? 1 : 0;
      // eigen takt filter: nur wenn im takt
      const eigen = (takt % 3 === x % 3) ? 1 : 0;
      let bit = (c3 ^ c9 ^ mirror ^ eigen) & 1;

      // segment bias
      if(seg === "PER") bit ^= (x*y + 81) % 2;
      if(seg === "HY") bit ^= (x + 3) % 2;
      if(seg === "WARB") bit ^= (y > 4 ? 1 : 0);
      if(seg === "KANAL") bit ^= (x < 3 ? 1 : 0);
      grid[y][x] = bit;
    }
  }
  return grid;
}

export function txBurst(atom, iki, ind, onTick) {
  let t = 0;
  let dir = 1; // hin=1 zurück=-1
  const id = setInterval(()=>{
    t += dir * 0.111; // 9 sec / 81 ticks
    if(t >= TAKT){ t = TAKT; dir = -1; }
    if(t <= 0){ t = 0; dir = 1; }
    const g = complexify_01({atom,iki,ind}, {}, t, "PER");
    onTick(g, t, dir>0 ? "HIN" : "ZURÜCK");
  }, 111);
  return ()=>clearInterval(id);
}
