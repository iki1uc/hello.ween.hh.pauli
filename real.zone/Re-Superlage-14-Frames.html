}

}

  height: 6px;
}

::-webkit-scrollbar-track {
  background: var(--bg);
}

::-webkit-scrollbar-thumb {

}

}

.selection\:bg-\[var\(--gold\)\] *::-moz-selection{

}

.selection\:bg-\[var\(--gold\)\]::-moz-selection{
  background-color: var(--gold);
}

.selection\:bg-\[var\(--gold\)\]::selection{
  background-color: var(--gold);
}

.selection\:text-black::-moz-selection{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.selection\:text-black::selection{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.hover\:border-\[var\(--gold\)\]:hover{
  border-color: var(--gold);
}

.hover\:bg-\[var\(--gold\)\]:hover{
  background-color: var(--gold);
}

.hover\:bg-transparent:hover{
  background-color: transparent;
}

.hover\:text-\[var\(--gold\)\]:hover{
  color: var(--gold);
}

.hover\:text-black:hover{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.group:hover .group-hover\:bg-\[var\(--gold\)\]{

}
