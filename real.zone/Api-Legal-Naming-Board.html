  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

html,
body,
#root {
  min-height: 100%;
}

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/*
 * Tailwind v4's Preflight no longer sets `cursor: pointer` on buttons, so
 * clickable controls fall back to the default arrow cursor. Restore the
 * pointer cursor on interactive elements so artifacts give a clear
 * "this is clickable" affordance on hover.
 */

button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label[for],
select:not(:disabled),
summary {
  cursor: pointer;
}

.selection\:bg-\[var\(--gold\)\] *::-moz-selection {
  background-color: var(--gold);
}

.selection\:bg-\[var\(--gold\)\] *::selection {
  background-color: var(--gold);
}

.selection\:text-black *::-moz-selection {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.selection\:text-black *::selection {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.selection\:bg-\[var\(--gold\)\]::-moz-selection {
  background-color: var(--gold);
}

.selection\:bg-\[var\(--gold\)\]::selection {
  background-color: var(--gold);
}

.selection\:text-black::-moz-selection {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.selection\:text-black::selection {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.hover\:border-\[var\(--fg-dim\)\]:hover {
  border-color: var(--fg-dim);
}

.hover\:bg-\[var\(--fg\)\]:hover {
  background-color: var(--fg);
}

.hover\:bg-\[var\(--gold\)\]:hover {
  background-color: var(--gold);
}

.hover\:bg-\[var\(--surface-2\)\]:hover {
  background-color: var(--surface-2);
}

.hover\:text-\[var\(--fg\)\]:hover {
  color: var(--fg);
}

.hover\:text-black:hover {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.focus\:border-\[var\(--gold\)\]:focus {
  border-color: var(--gold);
}

@media (min-width: 768px) {
  .md\:flex {
    display: flex;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .md\:grid-cols-\[1\.1fr_1fr\] {
    grid-template-columns: 1.1fr 1fr;
  }

  .md\:grid-cols-\[1\.2fr_1fr\] {
    grid-template-columns: 1.2fr 1fr;
  }

  .md\:grid-cols-\[1\.2fr_1fr_1fr\] {
    grid-template-columns: 1.2fr 1fr 1fr;
  }

  .md\:grid-cols-\[1fr_360px\] {
    grid-template-columns: 1fr 360px;
  }

  .md\:p-6 {
    padding: 1.5rem;
  }

  .md\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .md\:text-\[40px\] {
    font-size: 40px;
  }
}
