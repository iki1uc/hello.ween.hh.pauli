        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap');
        :root{
          --bg:#05070d;--panel:#0a0f19;--panel2:#0e1422;--line:#1e2a44;--line2:#243044;
          --fg:#e6eefc;--dim:#7f8ca3;--gold:#ffd700;--cyan:#00e5ff;
          --pink:#ff2d9a;--ok:#4dff9b;--bad:#ff5974;
          --safe-area-inset-top: env(safe-area-inset-top);
        }
        *{box-sizing:border-box}
        html,body{margin:0}
        body{background:var(--bg);color:var(--fg)}
        .app{
          min-height:100vh;
          background:
            radial-gradient(1200px 600px at 18% -12%, rgba(0,229,255,0.09), transparent 60%),
            radial-gradient(900px 500px at 92% -4%, rgba(255,215,0,0.08), transparent 55%),
            radial-gradient(700px 400px at 50% 120%, rgba(255,45,154,0.06), transparent),
            var(--bg);
          color:var(--fg);
          font:12px/1.5 'JetBrains Mono', ui-monospace, monospace;
          padding:14px;
          padding-top:max(14px,var(--safe-area-inset-top));
        }
        main{max-width:1120px;margin:0 auto}
        .header{
          border:1px solid var(--line);background:linear-gradient(180deg, rgba(14,20,34,0.95), rgba(10,15,25,0.92));
          backdrop-filter: blur(10px);
          padding:16px 18px;border-radius:14px;margin-bottom:12px;
          display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;
          box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        h1{margin:0;color:var(--gold);font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:.11em;line-height:1.05;text-shadow:0 0 20px rgba(255,215,0,0.2)}
        .sub{font-size:10px;color:var(--dim);letter-spacing:.22em;margin-bottom:2px}
        .sub2{font-size:10px;color:#9fb0cc;margin-top:4px;letter-spacing:.02em}
        .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
        .chip{padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim);background:#050912;white-space:nowrap;font-size:10px;letter-spacing:.02em}
        .chip.g{color:var(--gold);border-color:rgba(255,215,0,.38);background:rgba(255,215,0,.06)}
        .chip.c{color:var(--cyan);border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.06)}
        .chip.ok{color:var(--ok);border-color:rgba(77,255,155,.4);background:rgba(77,255,155,.08)}
        .chip.bad{color:var(--bad);border-color:rgba(255,89,116,.5);background:rgba(255,89,116,.08)}
        .chip.safe{color:var(--ok);border-color:rgba(77,255,155,.55);background:rgba(77,255,155,.14);font-weight:700;box-shadow:0 0 12px rgba(77,255,155,.15)}
        .chip.break{color:var(--pink);border-color:rgba(255,45,154,.55);background:rgba(255,45,154,.12);font-weight:700}
        .banner{
          border:1px dashed rgba(255,215,0,.35);
          background: linear-gradient(90deg, rgba(255,215,0,.09), rgba(255,45,154,.05) 60%, rgba(0,229,255,.06));
          padding:10px 14px;border-radius:10px;margin-bottom:12px;
          font-size:10px;line-height:1.6;color:#ffe9a0;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;
          box-shadow: inset 0 1px 0 rgba(255,215,0,.1);
        }
        .banner b{color:var(--gold);letter-spacing:.04em}
        .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);margin-top:4px;flex-shrink:0}
        .pipeline{
          display:flex;gap:6px;align-items:center;overflow:auto;padding:8px 0;margin-bottom:10px;scrollbar-width:thin;
          font-size:9px;color:var(--dim);letter-spacing:.08em;white-space:nowrap;
        }
        .pipe-node{padding:3px 8px;border:1px solid var(--line2);border-radius:999px;background:var(--panel2)}
        .pipe-node.active{color:var(--cyan);border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.08)}
        .pipe-node.wurzel{color:var(--gold);border-color:rgba(255,215,0,.4);background:rgba(255,215,0,.08);font-weight:700}
        .arrow{opacity:.5}
        .grid2{display:grid;grid-template-columns:360px 1fr;gap:12px}
        @media(max-width:900px){.grid2{grid-template-columns:1fr}}
        section{border:1px solid var(--line);background:linear-gradient(180deg, var(--panel), rgba(10,15,25,0.88));padding:14px;border-radius:14px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.03)}
        section::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg, transparent, rgba(255,215,0,.22), rgba(0,229,255,.18), transparent);pointer-events:none}
        h2{margin:0 0 8px;font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
        .grid-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
        .grid-wrap{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:#03050a;padding:5px;border-radius:10px;border:1px solid var(--line2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
        .cell{aspect-ratio:1;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);background:linear-gradient(180deg,#080c16,#050912);transition:all .15s;border-radius:4px;position:relative;font-weight:600}
        .cell:hover{border-color:rgba(0,229,255,.3);box-shadow:0 0 12px rgba(0,229,255,.12);transform:translateY(-1px);z-index:1}
        .cell.home{border-color:var(--gold);color:var(--gold);font-weight:800;box-shadow:inset 0 0 0 1px var(--gold), 0 0 18px rgba(255,215,0,.18);background:linear-gradient(180deg, rgba(255,215,0,.12), rgba(255,215,0,.04))}
        .cell.changed{background:rgba(0,229,255,.1);color:var(--cyan);border-color:rgba(0,229,255,.35)}
        .cell.zero{opacity:.42}
        .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
        button{background:transparent;color:var(--gold);border:1px solid rgba(255,215,0,.5);padding:7px 13px;font:inherit;font-size:10px;letter-spacing:.07em;cursor:pointer;border-radius:8px;transition:.18s;font-weight:700}
        button:hover{background:rgba(255,215,0,.12);transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,215,0,.12)}
        button.sec{color:var(--dim);border-color:var(--line2);font-weight:600}
        button.sec:hover{background:rgba(255,255,255,.06);color:var(--fg);border-color:rgba(255,255,255,.12)}
        button.run{color:var(--cyan);border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.06)}
        button.run:hover{background:rgba(0,229,255,.14);box-shadow:0 4px 16px rgba(0,229,255,.15)}
        button.active-filter{color:var(--fg);border-color:var(--fg);background:rgba(255,255,255,.08)}
        .pflichten{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        @media(max-width:560px){.pflichten{grid-template-columns:1fr}}
        .pf{border:1px solid var(--line);background:linear-gradient(180deg,#080d1a,#060a14);padding:10px 11px;border-radius:10px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:5px;position:relative}
        .pf:hover{border-color:var(--line2);background:linear-gradient(180deg,#0c1324,#080d1a);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
        .pf.active{border-color:var(--cyan);background:linear-gradient(180deg, rgba(0,229,255,.11), rgba(0,229,255,.04));box-shadow:0 0 0 1px rgba(0,229,255,.25), 0 8px 28px rgba(0,229,255,.14)}
        .pf-h{display:flex;justify-content:space-between;gap:6px;align-items:center}
        .pf-n{font-weight:800;color:var(--fg);font-size:11px;letter-spacing:.02em}
        .pf-id{font-size:9px;color:var(--dim);display:flex;gap:4px;align-items:center}
        .pf-d{font-size:9px;color:var(--dim);line-height:1.45}
        .pf-s{font-size:9px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
        .pf-s .p{color:var(--ok)} .pf-s .f{color:var(--bad)}
        .pf-home{font-size:9px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
        .log{height:160px;overflow:auto;background:#03050a;border:1px solid var(--line2);border-radius:10px;padding:7px;font-size:10px;line-height:1.55;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
        .log-line{padding:2px 0 2px 8px;color:var(--dim);border-left:2px solid transparent;margin:2px 0;border-radius:0 4px 4px 0}
        .log-line.w{color:var(--gold);border-left-color:rgba(255,215,0,.4);background:rgba(255,215,0,.04)}
        .log-line.v{color:var(--cyan);border-left-color:rgba(0,229,255,.35);background:rgba(0,229,255,.04)}
        .log-line.ok{color:var(--ok);border-left-color:rgba(77,255,155,.4);background:rgba(77,255,155,.04)}
        .log-line.err{color:var(--bad);border-left-color:rgba(255,89,116,.45);background:rgba(255,89,116,.06)}
        pre.meta-out{background:#03050a;border:1px solid var(--line2);border-radius:10px;padding:11px;font-size:9px;line-height:1.55;overflow:auto;max-height:300px;color:#9fb0cc;margin:0;white-space:pre-wrap;word-break:break-all}
        .home-check{font-size:10px;color:var(--dim);margin-top:12px;padding:9px 11px;border-left:2px solid var(--line2);line-height:1.6;border-radius:0 8px 8px 0;background:rgba(255,255,255,.02)}
        .home-check.ok{border-color:var(--ok);color:var(--ok);background:rgba(77,255,155,.06)}
        .home-check.warn{border-color:var(--pink);color:#ff9ab8;background:rgba(255,45,154,.06)}
        .sources{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
        @media(max-width:760px){.sources{grid-template-columns:1fr}}
        textarea{background:#03050a;border:1px solid var(--line2);border-radius:8px;color:var(--fg);padding:8px;font:10px/1.5 'JetBrains Mono', monospace;min-height:88px;resize:vertical;width:100%;outline:none;transition:.15s}
